name: GYMFORCE isolated migration rehearsal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'docs/STAGING-EXECUTOR-CATALOG-VERIFICATION-2026-11-23.md'
      - 'supabase/tests/staging_privilege_regression.sql'
      - '.github/workflows/isolated-migration-rehearsal.yml'

permissions:
  contents: read

jobs:
  disposable-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
      SUPABASE_PROJECT_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check migration inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)" -eq 37
          test -f supabase/tests/staging_privilege_regression.sql
          echo "Found 37 migration files. No remote Supabase project is configured."
      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          docker info >/dev/null
          supabase --version
          psql --version
      - name: Start disposable local Supabase stack with baseline migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gymforce-later-migrations
          mv supabase/migrations/20261110*.sql /tmp/gymforce-later-migrations/
          supabase start -x studio,imgproxy,logflare,vector,analytics
          mv /tmp/gymforce-later-migrations/*.sql supabase/migrations/
      - name: Diagnose reserved role creation in disposable transaction
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          if [[ "$DB_URL" != *"127.0.0.1"* && "$DB_URL" != *"localhost"* ]]; then
            echo "Refusing non-local database" >&2
            exit 1
          fi
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          CREATE ROLE gym_data_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE gym_owner_executor NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE ROLE gym_public_executor NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          SELECT granted.rolname AS granted_role, member.rolname AS member_role, grantor.rolname AS grantor_role
          FROM pg_auth_members m
          JOIN pg_roles granted ON granted.oid=m.roleid
          JOIN pg_roles member ON member.oid=m.member
          JOIN pg_roles grantor ON grantor.oid=m.grantor
          WHERE granted.rolname IN ('gym_data_owner','gym_owner_executor','gym_public_executor')
             OR member.rolname IN ('gym_data_owner','gym_owner_executor','gym_public_executor')
          ORDER BY 1,2;
          SELECT current_user, session_user, pg_has_role(current_user, 'supabase_admin', 'SET') AS can_set_supabase_admin;
          SET LOCAL ROLE supabase_admin;
          REVOKE gym_data_owner, gym_owner_executor, gym_public_executor FROM postgres;
          RESET ROLE;
          SELECT count(*) AS remaining_reserved_membership_edges
          FROM pg_auth_members m
          JOIN pg_roles reserved ON reserved.oid=m.roleid OR reserved.oid=m.member
          WHERE reserved.rolname IN ('gym_data_owner','gym_owner_executor','gym_public_executor');
          ROLLBACK;
          SQL
      - name: Replay migrations on disposable local database
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local --yes
      - name: Check final browser-role privilege boundaries
        shell: bash
        run: |
          set -euo pipefail
          # supabase status returns a local DB URL; never accept a hosted hostname.
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          if [[ "$DB_URL" != *"127.0.0.1"* && "$DB_URL" != *"localhost"* ]]; then
            echo "Refusing to connect to a non-local database" >&2
            exit 1
          fi
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/staging_privilege_regression.sql
      - name: Stop disposable stack
        if: always()
        run: supabase stop --no-backup || true
