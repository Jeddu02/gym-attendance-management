name: Offline candidate validation
on:
  pull_request:
    branches: [fix/codespaces-vite-private-artifact-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node --test tests/offline-claim-contract.test.mjs
      - run: npm run build
      - run: npm test
      - run: npm run test:security
